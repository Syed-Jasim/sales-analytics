<div class="customers-page">

  <div class="page-header">
    <div>
      <h1>Customers</h1>
      <p>Manage and view your customers</p>
    </div>

    <button class="refresh-btn" (click)="refreshCustomers()">
      Refresh
    </button>
  </div>

  <div *ngIf="loading" class="message">
    Loading customers...
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && !errorMessage" class="table-container">

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Customer Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let customer of customers">
          <td>{{ customer.id }}</td>
          <td>{{ customer.name }}</td>
          <td>{{ customer.email }}</td>
          <td>{{ customer.phone }}</td>
          <td>{{ customer.address }}</td>

          <td>
            <span
              [class.active]="customer.active"
              [class.inactive]="!customer.active">
              {{ customer.active ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="customers.length === 0" class="message">
      No customers found.
    </p>

  </div>

</div>
