<div class="dashboard-container">

  <div class="page-header">
    <div>
      <h1>Dashboard</h1>
      <p>Overview of your sales performance</p>
    </div>
  </div>

  <div class="summary-grid">

    <div class="summary-card revenue-card">
      <div>
        <p>Total Revenue</p>
        <h2>₹{{ revenue | number:'1.2-2' }}</h2>
      </div>
      <span class="card-icon">₹</span>
    </div>

    <div class="summary-card orders-card">
      <div>
        <p>Total Orders</p>
        <h2>{{ orders }}</h2>
      </div>
      <span class="card-icon">🛒</span>
    </div>

    <div class="summary-card products-card">
      <div>
        <p>Products Sold</p>
        <h2>{{ productsSold }}</h2>
      </div>
      <span class="card-icon">📦</span>
    </div>

    <div class="summary-card average-card">
      <div>
        <p>Average Order Value</p>
        <h2>₹{{ averageOrderValue | number:'1.2-2' }}</h2>
      </div>
      <span class="card-icon">📊</span>
    </div>

  </div>

</div>
